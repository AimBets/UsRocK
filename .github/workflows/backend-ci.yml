# Backend quality gate. Runs only when backend files (or this workflow) change; never touches frontend/.
name: Backend CI

on:
  push:
    branches: [main, "claude/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: usrock
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: usrock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usrock -d usrock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Ephemeral CI container credentials, not a secret.
      DATABASE_URL: postgres://usrock:ci_only_password@127.0.0.1:5432/usrock_test
      TEST_DATABASE_URL: postgres://usrock:ci_only_password@127.0.0.1:5432/usrock_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI contract is up to date
        run: npm run openapi:check

      - name: Unit tests
        run: npm test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Migrations apply on top of an existing database
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
